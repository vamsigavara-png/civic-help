services:
  - type: web
    name: helphub
    env: node
    buildCommand: npm install && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: helphub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        value: https://helphub-${RENDER_INSTANCE_ID}.onrender.com
      - key: NODE_ENV
        value: production

databases:
  - name: helphub-db
    databaseName: helphub
    user: postgres
    plan: free
